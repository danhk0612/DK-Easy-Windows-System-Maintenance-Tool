name: Windows tests

on:
  pull_request:
  push:
    branches: [main, test/windows-actions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF solution
        run: dotnet build DK.Easy.WindowsMaintenance.slnx -c Debug
      - name: Publish Windows x64
        run: dotnet publish src/DK.Easy.WindowsMaintenance/DK.Easy.WindowsMaintenance.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish
      - name: Run Windows integration checks
        run: dotnet run --project tests/WindowsSmoke/WindowsSmoke.csproj -c Release -- artifacts/publish/DK.Easy.WindowsMaintenance.dll
